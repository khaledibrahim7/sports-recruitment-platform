server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  application:
    name: sports-recruitment-backend

  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:SportsPlatform};encrypt=${DB_ENCRYPT:false};trustServerCertificate=${DB_TRUST_CERT:true}
    username: ${DB_USERNAME:hr-user}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 30

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=600s

app:
  storage:
    s3:
      bucket: ${VIDEO_S3_BUCKET:}
      region: ${VIDEO_S3_REGION:auto}
      endpoint: ${VIDEO_S3_ENDPOINT:}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      public-base-url: ${VIDEO_S3_PUBLIC_BASE_URL:}
      signed-url-ttl-seconds: ${VIDEO_S3_URL_TTL:3600}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    api-version: ${GEMINI_API_VERSION:v1beta}
    temperature: ${GEMINI_TEMPERATURE:0.7}
    max-output-tokens: ${GEMINI_MAX_TOKENS:2000}
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
    trusted-proxy-ips: ${TRUSTED_PROXY_IPS:127.0.0.1,::1}
  rate-limit:
    general-rpm: ${RATE_LIMIT_GENERAL:100}
    auth-rpm: ${RATE_LIMIT_AUTH:10}
    ai-rpm: ${RATE_LIMIT_AI:20}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
