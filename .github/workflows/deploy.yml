name: Deploy Angular App to GitHub Pages

on:
  push:
    branches: [prod]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and build
        working-directory: frontend
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          npm ci
          node -e "require('node:fs').writeFileSync('public/app-config.js', 'window.__APP_CONFIG__ = ' + JSON.stringify({ apiBaseUrl: process.env.API_BASE_URL || '', sentryDsn: process.env.SENTRY_DSN || '', environment: 'production' }) + ';')"
          npm run build -- --base-href "/sports-recruitment-platform/"
          cp dist/frontend/browser/index.html dist/frontend/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist/frontend/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
